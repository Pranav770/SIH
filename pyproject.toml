[project]
name = "sih"
version = "0.1.0"
description = "Autonomous AI drone for disaster response (SIH 2026, PSID 26177)"
readme = "README.md"
authors = [
    { name = "Pranav770", email = "175470329+Pranav770@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "onnxruntime>=1.18",
    "pymavlink>=2.4.49",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
]

[project.optional-dependencies]
# Optional PyTorch fallback for running best.pt directly (large: pulls torch).
pt = ["ultralytics>=8.3"]

# This repository is an application, not an installable package — it is run
# from source (dashboard/gcs.py) rather than imported.
[tool.uv]
package = false
